version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chayan}
      POSTGRES_USER: ${DB_USER:-chayan_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chayan_Alg0_2024!Secure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "8000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-chayan}
      DB_USER: ${DB_USER:-chayan_user}
      DB_PASSWORD: ${DB_PASSWORD:-chayan_Alg0_2024!Secure}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-tngtech/deepseek-r1t2-chimera:free}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-tngtech/deepseek-r1t2-chimera:free}
      AI_USE_MOCK: ${AI_USE_MOCK:-false}
      AI_HTTP_REFERER: ${AI_HTTP_REFERER:-}
      AI_X_TITLE: ${AI_X_TITLE:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-35000}
      AI_NARRATIVE_TOTAL_TIMEOUT_MS: ${AI_NARRATIVE_TOTAL_TIMEOUT_MS:-85000}
      AI_RETRY_MAX_ATTEMPTS: ${AI_RETRY_MAX_ATTEMPTS:-2}
      AI_RETRY_BASE_DELAY_MS: ${AI_RETRY_BASE_DELAY_MS:-1000}
      AI_MODEL_FALLBACKS: ${AI_MODEL_FALLBACKS:-}
      AI_SECONDARY_BASE_URL: ${AI_SECONDARY_BASE_URL:-}
      AI_SECONDARY_API_KEY: ${AI_SECONDARY_API_KEY:-}
      AI_SECONDARY_MODEL: ${AI_SECONDARY_MODEL:-}
      GITHUB_REQUEST_TIMEOUT_MS: ${GITHUB_REQUEST_TIMEOUT_MS:-8000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      GITHUB_SEARCH_PER_PAGE: ${GITHUB_SEARCH_PER_PAGE:-10}
      AI_COMPETITOR_MIN_RESULTS: ${AI_COMPETITOR_MIN_RESULTS:-5}
      AI_COMPETITOR_MAX_RESULTS: ${AI_COMPETITOR_MAX_RESULTS:-12}
      AI_COMPETITOR_AUGMENT_GITHUB: ${AI_COMPETITOR_AUGMENT_GITHUB:-false}
      AI_MCP_COMPETITOR_VARIANTS: ${AI_MCP_COMPETITOR_VARIANTS:-3}
      AI_MCP_COMPETITOR_RESULT_LIMIT: ${AI_MCP_COMPETITOR_RESULT_LIMIT:-24}
      AI_MCP_INDUSTRY_VARIANTS: ${AI_MCP_INDUSTRY_VARIANTS:-2}
      AI_MCP_RESULT_LIMIT: ${AI_MCP_RESULT_LIMIT:-12}
      MCP_FETCH_TIMEOUT_MS: ${MCP_FETCH_TIMEOUT_MS:-8000}
      MCP_TOOL_TIMEOUT_MS: ${MCP_TOOL_TIMEOUT_MS:-15000}
      MCP_SERVER_COMMAND: ${MCP_SERVER_COMMAND:-node}
      MCP_SERVER_PATH: ${MCP_SERVER_PATH:-./mcp-server.js}
      JWT_SECRET: ${JWT_SECRET:-chayan_jwt_replace_this_in_production_2026}
      JWT_ISSUER: ${JWT_ISSUER:-chayan-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-chayan-frontend}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918}
      AUTH_COOKIE_MAX_AGE_MS: ${AUTH_COOKIE_MAX_AGE_MS:-86400000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173,http://82.158.88.34:3000,https://chayan.cornna.xyz,http://chayan.cornna.xyz}
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
