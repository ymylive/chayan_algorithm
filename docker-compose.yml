version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chayan}
      POSTGRES_USER: ${DB_USER:-chayan_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_db_password_change_me_please}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "8000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-chayan}
      DB_USER: ${DB_USER:-chayan_user}
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_db_password_change_me_please}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://gmn.chuangzuoli.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-5.2}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-gpt-5.2}
      AI_PROTOCOL: ${AI_PROTOCOL:-responses}
      AI_USE_MOCK: ${AI_USE_MOCK:-false}
      AI_RESPONSES_INCLUDE_TEMPERATURE: ${AI_RESPONSES_INCLUDE_TEMPERATURE:-false}
      AI_RESPONSES_ENABLE_TOOL_LOOP: ${AI_RESPONSES_ENABLE_TOOL_LOOP:-false}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.35}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-900}
      AI_HTTP_REFERER: ${AI_HTTP_REFERER:-}
      AI_X_TITLE: ${AI_X_TITLE:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      AI_NARRATIVE_TOTAL_TIMEOUT_MS: ${AI_NARRATIVE_TOTAL_TIMEOUT_MS:-150000}
      AI_RETRY_MAX_ATTEMPTS: ${AI_RETRY_MAX_ATTEMPTS:-2}
      AI_RETRY_BASE_DELAY_MS: ${AI_RETRY_BASE_DELAY_MS:-1000}
      AI_MODEL_FALLBACKS: ${AI_MODEL_FALLBACKS:-}
      AI_SECONDARY_BASE_URL: ${AI_SECONDARY_BASE_URL:-https://api-inference.modelscope.cn/v1}
      AI_SECONDARY_PROTOCOL: ${AI_SECONDARY_PROTOCOL:-openai-completions}
      AI_SECONDARY_API_KEY: ${AI_SECONDARY_API_KEY:-}
      AI_SECONDARY_MODEL: ${AI_SECONDARY_MODEL:-ZhipuAI/GLM-5}
      AI_TERTIARY_BASE_URL: ${AI_TERTIARY_BASE_URL:-https://openrouter.ai/api/v1}
      AI_TERTIARY_PROTOCOL: ${AI_TERTIARY_PROTOCOL:-openai-completions}
      AI_TERTIARY_API_KEY: ${AI_TERTIARY_API_KEY:-}
      AI_TERTIARY_MODEL: ${AI_TERTIARY_MODEL:-deepseek/deepseek-r1-0528:free}
      AI_MCP_COMPETITOR_VARIANTS: ${AI_MCP_COMPETITOR_VARIANTS:-3}
      AI_MCP_COMPETITOR_RESULT_LIMIT: ${AI_MCP_COMPETITOR_RESULT_LIMIT:-24}
      AI_MCP_INDUSTRY_VARIANTS: ${AI_MCP_INDUSTRY_VARIANTS:-2}
      AI_MCP_RESULT_LIMIT: ${AI_MCP_RESULT_LIMIT:-12}
      MCP_FETCH_TIMEOUT_MS: ${MCP_FETCH_TIMEOUT_MS:-8000}
      MCP_WEB_RESULT_LIMIT: ${MCP_WEB_RESULT_LIMIT:-10}
      MCP_WEB_MIN_RESULTS: ${MCP_WEB_MIN_RESULTS:-18}
      MCP_WEB_MAX_WAVES: ${MCP_WEB_MAX_WAVES:-3}
      MCP_WEB_MIN_SOURCES: ${MCP_WEB_MIN_SOURCES:-3}
      MCP_REMOTE_MCP_TIMEOUT_MS: ${MCP_REMOTE_MCP_TIMEOUT_MS:-30000}
      MCP_HOST_DIVERSITY_PENALTY: ${MCP_HOST_DIVERSITY_PENALTY:-0.12}
      MCP_HOST_DIVERSITY_WINDOW: ${MCP_HOST_DIVERSITY_WINDOW:-12}
      MCP_ENABLE_WIKIPEDIA_SOURCE: ${MCP_ENABLE_WIKIPEDIA_SOURCE:-true}
      MCP_ENABLE_GOOGLE_NEWS_SOURCE: ${MCP_ENABLE_GOOGLE_NEWS_SOURCE:-true}
      MCP_DISABLE_LEGACY_SOURCES: ${MCP_DISABLE_LEGACY_SOURCES:-true}
      MCP_SEARXNG_BASE_URL: ${MCP_SEARXNG_BASE_URL:-}
      MCP_OPEN_WEBSEARCH_MCP_URL: ${MCP_OPEN_WEBSEARCH_MCP_URL:-}
      MCP_OPEN_WEBSEARCH_ENGINES: ${MCP_OPEN_WEBSEARCH_ENGINES:-duckduckgo,bing,baidu,csdn,juejin}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MCP_TAVILY_SEARCH_DEPTH: ${MCP_TAVILY_SEARCH_DEPTH:-basic}
      MCP_CRAWL4AI_MCP_URL: ${MCP_CRAWL4AI_MCP_URL:-}
      MCP_CRAWL4AI_SERVER_COMMAND: ${MCP_CRAWL4AI_SERVER_COMMAND:-}
      MCP_CRAWL4AI_SERVER_ARGS_JSON: ${MCP_CRAWL4AI_SERVER_ARGS_JSON:-[]}
      MCP_CRAWL4AI_ENGINE: ${MCP_CRAWL4AI_ENGINE:-duckduckgo}
      MCP_ENTITY_ALIAS_MAP_JSON: ${MCP_ENTITY_ALIAS_MAP_JSON:-{}}
      MCP_EDGAR_MCP_URL: ${MCP_EDGAR_MCP_URL:-}
      MCP_EDGAR_RECENT_FILINGS_LIMIT: ${MCP_EDGAR_RECENT_FILINGS_LIMIT:-12}
      MCP_TOOL_TIMEOUT_MS: ${MCP_TOOL_TIMEOUT_MS:-15000}
      AI_MCP_USE_MOCK_FALLBACK: ${AI_MCP_USE_MOCK_FALLBACK:-false}
      AI_PROMPT_MCP_SIGNAL_LIMIT: ${AI_PROMPT_MCP_SIGNAL_LIMIT:-8}
      AI_PROMPT_KEY_FINDINGS_LIMIT: ${AI_PROMPT_KEY_FINDINGS_LIMIT:-8}
      MCP_SERVER_COMMAND: ${MCP_SERVER_COMMAND:-node}
      MCP_SERVER_PATH: ${MCP_SERVER_PATH:-./mcp-server.js}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-chayan-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-chayan-frontend}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      AUTH_COOKIE_MAX_AGE_MS: ${AUTH_COOKIE_MAX_AGE_MS:-86400000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173,http://82.158.88.34:3000,https://chayan.cornna.xyz,http://chayan.cornna.xyz}
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
